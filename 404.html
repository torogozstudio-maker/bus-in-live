<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bus-in-live</title>
  <script>
    // GitHub Pages no tiene "fallback" para apps de una sola página: cualquier ruta
    // que no sea un archivo real (p. ej. /bus-in-live/mapa) llega aquí. Guardamos la
    // ruta pedida y volvemos a la raíz de la app, que la restaura (ver router.start()).
    // Se conservan ?query y #hash porque Supabase los usa en el login con Google.
    (function () {
      var base = '/bus-in-live/';
      var l = window.location;
      if (l.pathname.indexOf(base) === 0) {
        sessionStorage.setItem('spa-redirect', l.pathname.slice(base.length - 1));
      }
      l.replace(base + l.search + l.hash);
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0;url=/bus-in-live/"></noscript>
</head>
<body style="font-family: system-ui, sans-serif; text-align: center; padding: 4rem 1rem;">
  <p>Redirigiendo a <a href="/bus-in-live/">bus-in-live</a>…</p>
</body>
</html>
